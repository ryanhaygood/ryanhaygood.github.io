{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';

  // Clean up old navigation version stamps without reloading the page.
  (function () {
    var pageUrl = new URL(window.location.href);
    if (/^\d{14}$/.test(pageUrl.searchParams.get('v') || '')) {
      pageUrl.searchParams.delete('v');
      window.history.replaceState(window.history.state, '', pageUrl.pathname + pageUrl.search + pageUrl.hash);
    }
  })();
</script>

<!-- For all browsers -->
<!-- Refresh styles after each deployment, even when an older copy is cached. -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%Y%m%d%H%M%S' }}">

<meta http-equiv="cleartype" content="on">
